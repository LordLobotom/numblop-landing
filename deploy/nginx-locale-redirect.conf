# Server-side locale redirect for numblop.gutcloud.cz/
#
# Without this, `/` is served as a static page that only reaches the right
# language once client-side JavaScript runs (components/root-redirect.tsx).
# That still works, but it wastes the strongest URL on the site and gives
# no-JS clients and crawlers a language picker instead of content.
#
# Install:
#   1. Put the `map` block in the `http { }` context (e.g. an include under
#      /etc/nginx/conf.d/ — `map` is not valid inside `server { }`).
#   2. Put the `location = /` block inside the numblop.gutcloud.cz `server { }`.
#   3. nginx -t && systemctl reload nginx
#
# The static export stays the fallback: if this is not installed, `/index.html`
# still renders a crawlable language picker with rel=canonical to /en/.

# --- http { } context -------------------------------------------------------

# Matches the first tag of Accept-Language (e.g. "cs-CZ,cs;q=0.9,en;q=0.8").
# Norwegian device locales (no, nn) fold into the shipped Bokmål locale. The
# region-specific Portuguese match must precede the general Portuguese match.
# These rules mirror detectLocale() in lib/i18n/detect-locale.ts.
map $http_accept_language $numblop_locale {
    default        en;
    ~*^en          en;
    ~*^cs          cs;
    ~*^sk          sk;
    ~*^de          de;
    ~*^es          es;
    ~*^fi          fi;
    ~*^fr          fr;
    ~*^(nb|nn|no)  nb;
    ~*^pl          pl;
    ~*^sv          sv;
    ~*^pt-pt       pt-PT;
    ~*^pt          pt-BR;
    ~*^it          it;
    ~*^da          da;
    ~*^nl          nl;
    ~*^ja          ja;
    ~*^ko          ko;
    ~*^tr          tr;
    ~*^vi          vi;
    ~*^id          id;
}

# --- server { } context -----------------------------------------------------

# 302, not 301: the target depends on the visitor's Accept-Language, so it must
# not be cached as a permanent mapping. Crawlers follow it to /en/, which is
# also the rel=canonical and the hreflang x-default target.
location = / {
    return 302 /$numblop_locale/;
}
